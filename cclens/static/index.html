<!doctype html>
<html lang="en">
<head>

<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/sessions">cclens</a>

<div class="toast" id="toast" hidden></div>
