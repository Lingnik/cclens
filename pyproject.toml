[project]
name = "cclens"
version = "0.1.0"
description = "Local browser for Claude Code transcripts and hook logs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Taylor Meek" }]
keywords = ["claude-code", "jsonl", "logs", "transcripts", "hooks"]
dependencies = []

[project.scripts]
cclens = "cclens.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cclens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
